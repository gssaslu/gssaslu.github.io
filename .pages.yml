  - name: labels
    label: Buttons & Screen-Reader Labels
    description: >-
      Small wording used across the whole site. Most of these are never seen —
      they are what a screen reader announces for a button or an icon. Editing
      them changes every page at once, and a blank field leaves a control with
      no name at all, so change them only deliberately.
    type: file
    path: src/_data/labels.json
    fields:
      - name: skipLink
        label: "Skip link (first thing a keyboard user reaches)"
        type: string
      - name: navLabel
        label: Name of the main navigation
        type: string
      - name: noPhotoPrefix
        label: Text before a name when someone has no photo
        type: string
        description: >-
          The person's name is added after it, giving "No photo available for
          Jane Doe".
      - name: socialInstagram
        label: "Instagram icon: label"
        type: string
      - name: socialLinkedin
        label: "LinkedIn icon: label"
        type: string
      - name: socialLinkedinSuffix
        label: "Officer LinkedIn icon: words after the name"
        type: string
        description: >-
          The officer's name is put before it, giving "Ashutosh Pawar on
          LinkedIn" for screen readers.
      - name: socialGithub
        label: "GitHub icon: label"
        type: string
      - name: bioDrawerLabel
        label: "Officer bio panel: name"
        type: string
      - name: bioDrawerAboutPrefix
        label: "Officer bio panel: word before the officer's name"
        type: string
        description: >-
          The name is added after it, giving "About Ashutosh Pawar".
      - name: bioDrawerClose
        label: "Officer bio panel: close button"
        type: string
      - name: lightboxLabel
        label: "Photo viewer: name"
        type: string
      - name: lightboxClose
        label: "Photo viewer: close button"
        type: string
      - name: lightboxPrev
        label: "Photo viewer: previous button"
        type: string
      - name: lightboxNext
        label: "Photo viewer: next button"
        type: string
      - name: lightboxPhotoAlt
        label: "Photo viewer: description for a photo with no caption"
        type: string

